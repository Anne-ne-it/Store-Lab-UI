
<!doctype html> <!--Indica al navegador que el documento utiliza HTML5-->
<html lang="es"> <!--Indica que el idioma principal de la página es español-->

  <head> <!--Contiene información de configuración y metadatos de la página-->
    <meta charset="UTF-8" /> <!--Permite utilizar caracteres especiales-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!--Define el favicon que aparece en la pestaña del navegador-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!--Hace que la página se adapte correctamente a dispositivos móviles-->
    <title>StoreLab UI</title> <!--Define el título que aparece en la pestaña del navegador-->
  </head> <!--Cierra la sección head-->
  
  <body> <!--Contiene todo el contenido visible de la página-->
    <div id="root"></div> <!--Elemento donde React montará toda la aplicación-->
    <script type="module" src="/src/main.jsx"></script> <!--Carga el archivo principal de React-->
  </body> <!--Cierra el cuerpo de la página-->

</html> <!--Cierra el documento HTML-->
